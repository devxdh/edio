name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            output_name: edio-linux-amd64
            archive_name: edio-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            output_name: edio-linux-arm64
            archive_name: edio-linux-arm64.tar.gz
          # macOS
          - goos: darwin
            goarch: amd64
            output_name: edio-darwin-amd64
            archive_name: edio-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            output_name: edio-darwin-arm64
            archive_name: edio-darwin-arm64.tar.gz
          # Windows
          - goos: windows
            goarch: amd64
            output_name: edio-windows-amd64.exe
            archive_name: edio-windows-amd64.zip
          - goos: windows
            goarch: arm64
            output_name: edio-windows-arm64.exe
            archive_name: edio-windows-arm64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          go build -ldflags="-s -w -X main.version=${TAG_NAME}" -o dist/${{ matrix.output_name }} ./cmd/edio

      - name: Package Archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar -czf ${{ matrix.archive_name }} ${{ matrix.output_name }}
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package Archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip ${{ matrix.archive_name }} ${{ matrix.output_name }}
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.archive_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Generate Ephemeral Homebrew Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "homebrew-tap"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Download Checksums & Generate Formula
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          OWNER="${{ github.repository_owner }}"

          # Download sha256 sums from the release
          curl -sL "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-darwin-arm64.tar.gz.sha256" -o darwin_arm64.sha256
          curl -sL "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-darwin-amd64.tar.gz.sha256" -o darwin_amd64.sha256
          curl -sL "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-linux-arm64.tar.gz.sha256" -o linux_arm64.sha256
          curl -sL "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-linux-amd64.tar.gz.sha256" -o linux_amd64.sha256

          SHA_DARWIN_ARM64=$(awk '{print $1}' darwin_arm64.sha256)
          SHA_DARWIN_AMD64=$(awk '{print $1}' darwin_amd64.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' linux_arm64.sha256)
          SHA_LINUX_AMD64=$(awk '{print $1}' linux_amd64.sha256)

          mkdir -p homebrew-tap/Formula

          cat << EOF > homebrew-tap/Formula/edio.rb
          class Edio < Formula
            desc "Branchless shadow Git version control for AI coding agents"
            homepage "https://github.com/${OWNER}/edio"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"

                def install
                  bin.install "edio-darwin-arm64" => "edio"
                end
              else
                url "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"

                def install
                  bin.install "edio-darwin-amd64" => "edio"
                end
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"

                def install
                  bin.install "edio-linux-arm64" => "edio"
                end
              else
                url "https://github.com/${OWNER}/edio/releases/download/${TAG}/edio-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"

                def install
                  bin.install "edio-linux-amd64" => "edio"
                end
              end
            end

            test do
              system "#{bin}/edio", "--help"
            end
          end
          EOF

      - name: Commit and Push Formula
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/edio.rb
          if git diff --staged --quiet; then
            echo "No changes to formula"
          else
            git commit -m "chore: bump formula to ${{ github.ref_name }}"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${OWNER}/homebrew-tap.git" main
          fi
